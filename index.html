<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="./assets/github-logo-light.png" type="image/x-icon">

    <!-- For Basic CSS -->
    <link rel="stylesheet" href="./styles/styles.css">

    <!-- Taiwind + DaisyUI Introduced -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome - (if needed) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body class="geist-font">
    <div class="max-w-[1600px] mx-auto navbar flex justify-between bg-base-100 shadow-sm">
        <div class="flex items-center gap-1">
            <img class="w-10 h-10" src="./assets/github-logo.png" alt="">
            <a class="btn btn-ghost text-xl p-0">GitHub Issues Tracker</a>
        </div>
        <div class="flex gap-2">
            <input id="search" type="text" placeholder="🔍 Search Issues" class="input input-bordered w-24 md:w-auto" />
            <button id="search-btn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> New Issue</button>
        </div>
    </div>

    <main class="container mx-auto mt-15 space-y-4 mb-5">
        <!-- TOOGLE PART -->
        <section id="toogle-button-section" class="card border border-gray-200 p-6 flex flex-row space-x-2">
            <button id="all-filter-btn" onclick="toogleStyle('all-filter-btn')"
                class="btn btn-primary px-8">All</button>
            <button id="open-filter-btn" onclick="toogleStyle('open-filter-btn')"
                class="btn bg-white text-gray-500 px-8">Open</button>
            <button id="closed-filter-btn" onclick="toogleStyle('closed-filter-btn')"
                class="btn bg-white text-gray-500 px-8">Closed</button>
        </section>

        <section id="working-section" class="card border border-gray-200">
            <!-- COUNTS SHOW -->
            <div id="count-part" class="flex justify-between items-center p-6">
                <div id="" class="left-part flex items-center gap-2">
                    <div class="image bg-[#ECE4FF] p-2 rounded-full">
                        <img src="./assets/Aperture.png" alt="">
                    </div>
                    <div id="text-issue-count">
                        <div id="issue-count" class="text-xl font-semibold text-[#1F2937]">0</div>
                        <p class="text-[#64748B]">Track and manage your project issues</p>
                    </div>
                </div>

                <div class="right-part flex gap-2">
                    <p class="font-medium"><i class="fa-solid fa-circle" style="color: #00A96E;"></i> Open</p>
                    <p class="font-medium"><i class="fa-solid fa-circle" style="color: #A855F7;"></i> Closed</p>
                </div>
            </div>

            <hr class="border border-gray-200">

            <!-- LOADING SPINNER -->
            <div id="loading-spinner" class="h-[60vh] hidden justify-center">
                <span class="loading loading-spinner loading-xl"></span>
            </div>

            <!-- ALL CARDS SECTION -->
            <div id="cards-container" class="p-6 grid grid-cols-4 gap-3">

            </div>
        </section>
    </main>

    <dialog id="issue_modal" class="modal">
        <div class="modal-box max-w-2xl">

            <h3 id="modal-title" class="text-2xl font-bold mb-2">title</h3>

            <div class="flex items-center gap-2 text-sm mb-6">
                <span id="modal-status" class="text-xs font-medium">open</span>
                <img src="./assets/Ellipse 5.png" alt="">
                <span id="modal-author" class="text-xs text-[#64748B]">author</span>
                <img src="./assets/Ellipse 5.png" alt="">
                <span id="modal-date" class="text-xs text-[#64748B]">date</span>
            </div>

            <div id="modal-labels" class="flex gap-1 mb-6 font-medium text-xs">labels</div>

            <p id="modal-description" class="text-sm text-[#64748B] mb-6">description</p>

            <div class="grid grid-cols-2 gap-3 bg-gray-100 p-4 rounded-lg mb-6">
                <div>
                    <p class="text-[#64748B]">Assignee:</p>
                    <p id="modal-assignee" class="font-semibold text-[#1F2937]">Fahim Ahmed</p>
                </div>

                <div>
                    <p class="text-[#64748B]">Priority:</p>
                    <span id="modal-priority" class="font-medium text-xs">high</span>
                </div>
            </div>

            <div class="modal-action">
                <form method="dialog">
                    <button class="btn btn-primary">Close</button>
                </form>
            </div>

        </div>
    </dialog>
    <button onclick="issue_modal.showModal()">HEY</button>

    <script src="./scripts/script.js"></script>
</body>

</html>
