<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="./assets/github-logo-light.png" type="image/x-icon">

    <!-- For Basic CSS -->
    <link rel="stylesheet" href="./styles/styles.css">

    <!-- Taiwind + DaisyUI Introduced -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome - (if needed) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body class="geist-font">
    <div class="max-w-[1600px] mx-auto navbar flex justify-between bg-base-100 shadow-sm">
        <div class="flex items-center gap-1">
            <img class="w-10 h-10" src="./assets/github-logo.png" alt="">
            <a class="btn btn-ghost text-xl p-0">GitHub Issues Tracker</a>
        </div>
        <div class="flex gap-2">
            <input type="text" placeholder="Search Issues" class="input input-bordered w-24 md:w-auto" />
            <button class="btn btn-primary">+ New Issue</button>
        </div>
    </div>
</body>

</html>
