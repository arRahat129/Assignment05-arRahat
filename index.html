<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="./assets/github-logo-light.png" type="image/x-icon">

    <!-- For Basic CSS -->
    <link rel="stylesheet" href="./styles/styles.css">

    <!-- Taiwind + DaisyUI Introduced -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome - (if needed) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body class="geist-font">

    <div id="login-container" class="h-screen flex justify-center items-center bg-gray-100 p-4">
        <div class="bg-white w-full max-w-md p-8 space-y-6 rounded-xl shadow-lg border border-gray-200">

            <div class="text-center">
                <div class="flex justify-center mb-6">
                    <img src="./assets/github-logo.png" alt="">
                </div>

                <h2 class="text-2xl font-semibold text-[#1F2937] mb1">GitHub Issues Tracker</h2>
                <p class="text-[#64748B]">Sign in to manage your issues</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="font-medium">Username</label>
                    <input id="login-username" type="text" placeholder="Enter Username"
                        class="text-[#64748B] border-[#E4E4E7] p-4 rounded-lg w-full my-2">

                    <p class="text-sm text-[#4A00FF]">Default: admin</p>
                </div>

                <div>
                    <label class="font-medium">Password</label>
                    <input id="login-password" type="password" placeholder="Enter Password"
                        class="text-[#64748B] border-[#E4E4E7] p-4 rounded-lg w-full my-2">

                    <p class="text-sm text-[#4A00FF]">Default: admin123</p>
                </div>
            </div>

            <div class="space-y-6">
                <button id="login-btn" class="btn w-full text-white bg-[#4A00FF] font-semibold rounded-lg p-4">
                    Sign In
                </button>

                <div class="flex items-center gap-2">
                    <hr class="w-[45%] border border-[#E4E4E7]"><span class="text-[#1F2937]">OR</span><hr class="w-[45%] border border-[#E4E4E7]">
                </div>

                <div>
                    <p class="text-sm text-[#64748B] text-center mb-2">Demo Credentials:</p>
                    <div class="bg-[#F8FAFC] p-6 rounded-lg text-sm text-center">
                        <p><span class="font-semibold">Username:</span> admin</p>
                        <p><span class="font-semibold">Password:</span> admin123</p>
                    </div>
                </div>

            </div>
        </div>
    </div>


    <div id="overallContainer" class="hidden mb-10">
        <div class="max-w-[1600px] mx-auto navbar flex flex-col md:flex-row gap-5 md:gap-0 justify-between bg-base-100 shadow-sm px-20 py-5 md:py-1">
            <div class="flex items-center gap-1">
                <img class="w-10 h-10" src="./assets/github-logo.png" alt="">
                <h1 class="text-lg md:text-2xl font-semibold text-[#1F2937]">GitHub Issues Tracker</h1>
            </div>
            <div class="flex flex-col md:flex-row gap-2 md:gap-2">
                <input id="search" type="text" placeholder="🔍 Search Issues"
                    class="input input-bordered w-full md:w-auto" />
                <button id="search-btn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> New Issue</button>
            </div>
        </div>

        <main class="container mx-auto mt-15 space-y-4 mb-5">
            <!-- TOOGLE PART -->
            <section id="toogle-button-section" class="card border border-gray-200 p-6 flex flex-col md:flex-row space-x-0 space-y-3 md:space-x-2 md:space-y-0">
                <button id="all-filter-btn" onclick="toogleStyle('all-filter-btn')"
                    class="btn btn-primary px-8">All</button>
                <button id="open-filter-btn" onclick="toogleStyle('open-filter-btn')"
                    class="btn bg-white text-gray-500 px-8">Open</button>
                <button id="closed-filter-btn" onclick="toogleStyle('closed-filter-btn')"
                    class="btn bg-white text-gray-500 px-8">Closed</button>
            </section>

            <section id="working-section" class="card border border-gray-200">
                <!-- COUNTS SHOW -->
                <div id="count-part" class="flex flex-col gap-4 md:flex-row justify-between items-center p-6">
                    <div id="" class="left-part flex items-center gap-2">
                        <div class="image bg-[#ECE4FF] p-2 rounded-full">
                            <img src="./assets/Aperture.png" alt="">
                        </div>
                        <div id="text-issue-count">
                            <div id="issue-count" class="text-xl font-semibold text-[#1F2937]">0</div>
                            <p class="text-[#64748B]">Track and manage your project issues</p>
                        </div>
                    </div>

                    <div class="right-part flex flex-col md:flex-row gap-2">
                        <p class="font-medium"><i class="fa-solid fa-circle" style="color: #00A96E;"></i> Open</p>
                        <p class="font-medium"><i class="fa-solid fa-circle" style="color: #A855F7;"></i> Closed</p>
                    </div>
                </div>

                <hr class="border border-gray-200">

                <!-- LOADING SPINNER -->
                <div id="loading-spinner" class="h-[60vh] hidden justify-center">
                    <span class="loading loading-spinner loading-xl"></span>
                </div>

                <!-- ALL CARDS SECTION -->
                <div id="cards-container" class="p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-3">

                </div>
            </section>
        </main>
    </div>

    <dialog id="issue_modal" class="modal">
        <div class="modal-box max-w-2xl">

            <h3 id="modal-title" class="text-2xl font-bold mb-2"></h3>

            <div class="flex items-center gap-2 text-sm mb-6">
                <span id="modal-status" class="text-xs font-medium"></span>
                <img src="./assets/Ellipse 5.png" alt="">
                <span id="modal-author" class="text-xs text-[#64748B]"></span>
                <img src="./assets/Ellipse 5.png" alt="">
                <span id="modal-date" class="text-xs text-[#64748B]"></span>
            </div>

            <div id="modal-labels" class="flex gap-1 mb-6 font-medium text-xs"></div>

            <p id="modal-description" class="text-sm text-[#64748B] mb-6"></p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-gray-100 p-4 rounded-lg mb-6">
                <div>
                    <p class="text-[#64748B]">Assignee:</p>
                    <p id="modal-assignee" class="font-semibold text-[#1F2937]"></p>
                </div>

                <div>
                    <p class="text-[#64748B]">Priority:</p>
                    <span id="modal-priority" class="font-medium text-xs"></span>
                </div>
            </div>

            <div class="modal-action">
                <form method="dialog">
                    <button class="btn btn-primary">Close</button>
                </form>
            </div>

        </div>
    </dialog>

    <script src="./scripts/script.js"></script>
</body>

</html>
